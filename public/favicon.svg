<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Container with subtle border -->
  <rect width="64" height="64" rx="6" fill="#0A0A0A"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="5.5" stroke="#222222"/>
  
  <!-- Mast / Vertical Score Axis of 'K' -->
  <rect x="12" y="9" width="8" height="46" rx="2" fill="#F0EDE7"/>
  <!-- KKM Passing Threshold Notch in Phosphor Mint -->
  <rect x="5" y="31" width="14" height="4.5" rx="2" fill="#4BFFA0"/>

  <!-- Pulley Sheave Wheel in Cuberto Orange -->
  <circle cx="37" cy="33" r="14" fill="#161616" stroke="#FF4D00" stroke-width="4.5"/>
  <circle cx="37" cy="33" r="7.5" stroke="#2B2B2B" stroke-width="1.8"/>
  <circle cx="37" cy="33" r="5" fill="#FF4D00"/>
  <circle cx="37" cy="33" r="2" fill="#0A0A0A"/>

  <!-- Hoist Cable: Loops and launches Up-Right (Top Arm of K) -->
  <path d="M 37 19 L 52 10" stroke="#FF4D00" stroke-width="6" stroke-linecap="round"/>
  <!-- Upward Grade Trajectory Arrow -->
  <path d="M 43 7.5 L 54.5 8 L 53 19" fill="none" stroke="#FF4D00" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Anchor Cable: Tensioning Down-Right (Lower Arm of K) -->
  <path d="M 37 47 L 52 56" stroke="#F0EDE7" stroke-width="6" stroke-linecap="round"/>
  <!-- Delta / Weight Block -->
  <rect x="47.5" y="51" width="9.5" height="9.5" rx="2" fill="#FF4D00"/>
</svg>

